name: RDS audit checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install 'pypdf>=5,<7'
      - run: python -m unittest discover -v
        env:
          AWS_EC2_METADATA_DISABLED: 'true'
      - run: bash -n install.sh
      - run: bash -n install-mail.sh
      - name: Validate systemd calendar and unit syntax
        run: |
          systemd-analyze calendar '*-*-* 08:10:00 Asia/Shanghai'
          python -m unittest test_unit_render.SystemdIntegrationTests -v
          python -m unittest test_mail_install.MailSystemdIntegrationTests -v
