name: RDS audit checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -v
        env:
          AWS_EC2_METADATA_DISABLED: 'true'
      - run: bash -n install.sh
      - name: Validate systemd calendar and unit syntax
        run: |
          systemd-analyze calendar '*-*-* 08:10:00 Asia/Shanghai'
          sed -e 's|@RUN_USER@|root|g' -e 's|@RUN_GROUP@|root|g' -e 's|@PROJECT_ROOT@|/tmp|g' -e 's|@HOME_ENV@|HOME=/root|g' -e 's|@PYTHON@|/usr/bin/python3|g' -e 's|@RUNNER@|/tmp/run_daily.py|g' deploy/aws-rds-audit.service > /tmp/aws-rds-audit.service
          systemd-analyze verify /tmp/aws-rds-audit.service deploy/aws-rds-audit.timer
